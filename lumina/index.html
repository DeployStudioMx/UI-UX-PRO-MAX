<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dental Lumina — Polanco, CDMX</title>
  <meta name="description" content="Clínica dental de alta especialidad en Polanco, CDMX. Ortodoncia, implantes, estética dental y más." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans:  ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --mint:        #0D9488;
      --mint-light:  #14B8A6;
      --mint-pale:   #CCFBF1;
      --white:       #FFFFFF;
      --navy:        #0F172A;
      --slate:       #475569;
      --slate-light: #94A3B8;
      --border:      #E2E8F0;
      --gold:        #C9A84C;
      --bg:          #F8FAFB;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html  { scroll-behavior: smooth; }
    body  { font-family: 'Inter', sans-serif; background: var(--white); color: var(--navy); overflow-x: hidden; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }

    /* ── Reveal ──────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .d1 { transition-delay: 0.1s;  }
    .d2 { transition-delay: 0.25s; }
    .d3 { transition-delay: 0.4s;  }
    .d4 { transition-delay: 0.55s; }

    /* ── Header ──────────────────────────── */
    #site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      padding: 2rem 0;
      transition:
        background 0.55s cubic-bezier(0.16,1,0.3,1),
        padding    0.55s cubic-bezier(0.16,1,0.3,1),
        box-shadow 0.55s cubic-bezier(0.16,1,0.3,1),
        border-color 0.55s;
      border-bottom: 1px solid transparent;
    }

    /* State 2 — liquid glass dark (scrolled, still over hero) */
    #site-header.scrolled {
      padding: 1.1rem 0;
      background: rgba(8, 16, 26, 0.14);
      backdrop-filter: blur(56px) saturate(180%) brightness(1.1);
      -webkit-backdrop-filter: blur(56px) saturate(180%) brightness(1.1);
      border-bottom: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.13),
        0 8px 48px rgba(0,0,0,0.08);
    }

    /* State 3 — liquid glass light (past hero, over white sections) */
    #site-header.scrolled.over-light {
      background: rgba(248,250,251,0.68);
      backdrop-filter: blur(56px) saturate(200%) brightness(1.04);
      -webkit-backdrop-filter: blur(56px) saturate(200%) brightness(1.04);
      border-bottom: 1px solid rgba(255,255,255,0.92);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.95),
        0 6px 40px rgba(15,23,42,0.07);
    }

    /* Logo */
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 600;
      color: white; text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.5s;
    }
    .logo-dot { color: var(--gold); }
    #site-header.scrolled.over-light .logo { color: var(--navy); }

    /* Nav links */
    .nav-link {
      font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.85); text-decoration: none;
      padding: 0.25rem 0; position: relative;
      transition: color 0.3s;
    }
    .nav-link::after {
      content:''; position:absolute; bottom:-2px; left:0;
      width:0; height:1.5px; background:var(--mint);
      transition: width 0.25s ease;
    }
    .nav-link:hover { color: white; }
    .nav-link:hover::after { width: 100%; }
    #site-header.scrolled.over-light .nav-link { color: var(--slate); }
    #site-header.scrolled.over-light .nav-link:hover { color: var(--navy); }

    /* Phone link */
    .phone-link {
      font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.75);
      text-decoration: none; display: flex; align-items: center; gap: 0.4rem;
      transition: color 0.3s;
    }
    .phone-link:hover { color: white; }
    #site-header.scrolled.over-light .phone-link { color: var(--slate-light); }
    #site-header.scrolled.over-light .phone-link:hover { color: var(--navy); }

    /* CTA nav button */
    .btn-nav {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--mint); color: white;
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em;
      padding: 0.6rem 1.4rem; border-radius: 50px;
      text-decoration: none; min-height: 44px;
      transition: background 0.2s, transform 0.15s;
      touch-action: manipulation;
    }
    .btn-nav:hover { background: var(--mint-light); transform: translateY(-1px); }
    .btn-nav:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

    /* Hamburger icon */
    .menu-icon { color: white; transition: color 0.5s; }
    #site-header.scrolled.over-light .menu-icon { color: var(--navy); }

    /* ── Mobile menu ─────────────────────── */
    #mob-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(15,23,42,0.97); backdrop-filter: blur(20px);
      flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
    }
    #mob-overlay.open { display: flex; }
    .mob-link {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; color: white; text-decoration: none;
      transition: color 0.2s;
    }
    .mob-link:hover { color: var(--mint-light); }

    /* ── HERO ────────────────────────────── */
    /* White page background — image lives inside a rounded card */
    body { background: var(--white); }

    #hero {
      padding: 1rem;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--white);
    }
    @media (min-width: 640px)  { #hero { padding: 1rem; } }
    @media (min-width: 1024px) { #hero { padding: 1rem; } }

    /* The rounded card that holds the image */
    #hero-card {
      position: relative;
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      min-height: calc(100dvh - 2rem);
      display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: 0 24px 80px rgba(15,23,42,0.18);
    }
    @media (min-width: 640px)  { #hero-card { border-radius: 24px; min-height: calc(100dvh - 2rem); } }
    @media (min-width: 1024px) { #hero-card { border-radius: 32px; min-height: calc(100dvh - 2rem); } }

    /* Background image inside card */
    #hero-bg {
      position: absolute; inset: 0;
      background: var(--navy);
    }
    #hero-bg img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 25%;
      display: block;
    }

    /* Gradient overlay */
    #hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(15,23,42,0.75) 0%, rgba(15,23,42,0.4) 55%, rgba(15,23,42,0.1) 100%),
        linear-gradient(to top,   rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.0) 55%);
    }

    /* Hero content — inside the card, bottom-left */
    #hero-content {
      position: relative; z-index: 10;
      padding: 2.5rem 2.5rem 2rem;
      max-width: 820px;
    }
    @media (min-width: 640px)  { #hero-content { padding: 3rem 3.5rem 2.5rem; } }
    @media (min-width: 1024px) { #hero-content { padding: 4rem 5rem 3.5rem; } }

    /* Big headline */
    .hero-headline {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(3rem, 7vw, 7rem);
      line-height: 1.0;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
    }
    .hero-headline em {
      font-style: italic;
      color: var(--mint-light);
    }

    /* Sub-line — just one sentence */
    .hero-sub {
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      font-weight: 300;
      color: rgba(255,255,255,0.72);
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 2.5rem;
      letter-spacing: 0.01em;
    }

    /* CTA hero button */
    .btn-hero {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: var(--mint);
      color: white;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 1rem 2.25rem; border-radius: 50px;
      text-decoration: none; min-height: 52px;
      box-shadow: 0 4px 24px rgba(13,148,136,0.45);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation; position: relative; overflow: hidden;
    }
    .btn-hero::before {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
      border-radius: inherit;
    }
    .btn-hero:hover  { background: var(--mint-light); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(13,148,136,0.55); }
    .btn-hero:active { transform: translateY(0); }
    .btn-hero:focus-visible { outline: 3px solid white; outline-offset: 3px; }


    /* Scroll indicator */
    @keyframes scrollBounce {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50%      { transform: translateY(8px); opacity: 1; }
    }
    .scroll-hint {
      position: absolute; right: 2.5rem; bottom: 7rem; z-index: 11;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      animation: scrollBounce 2.5s ease-in-out infinite;
    }
    @media (max-width: 768px) { .scroll-hint { display: none; } }

    /* ── Buttons for other sections ──────── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: linear-gradient(135deg, var(--mint-light) 0%, var(--mint) 100%);
      color: white; font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.9rem 2rem; border-radius: 50px; border: none;
      cursor: pointer; text-decoration: none; min-height: 48px;
      box-shadow: 0 4px 18px rgba(13,148,136,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(13,148,136,0.45); }
    .btn-primary:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

    .btn-outline {
      display: inline-flex; align-items: center; gap: 0.5rem;
      border: 1.5px solid var(--border); color: var(--navy);
      background: var(--white); font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.9rem 2rem; border-radius: 50px;
      cursor: pointer; text-decoration: none; min-height: 48px;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      touch-action: manipulation;
    }
    .btn-outline:hover { border-color: var(--mint); color: var(--mint); background: #F0FDFA; }
  </style>
</head>

<body>

<a href="#hero-content"
   class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[9999]
          focus:bg-mint focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:font-semibold">
  Ir al contenido principal
</a>

<!-- ══════════════════════════════════════
     MOBILE MENU
══════════════════════════════════════ -->
<nav id="mob-overlay" role="dialog" aria-modal="true" aria-label="Menú principal">
  <button id="close-mob" aria-label="Cerrar menú"
          class="absolute top-6 right-6 p-2 text-white/50 hover:text-white transition-colors">

  <a href="#testimonios" class="mob-link" onclick="closeMob()">Testimonios</a>

  <a href="#contacto" class="btn-hero mt-4" onclick="closeMob()">Agenda tu cita</a>

<!-- ══════════════════════════════════════
     HEADER
══════════════════════════════════════ -->
<header id="site-header">
  <div class="max-w-screen-xl mx-auto px-6 sm:px-10 flex items-center justify-between gap-6">

    <!-- Logo -->
    <a href="#" class="logo flex items-center gap-2" aria-label="Clínica Dental Lumina">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">

        <path d="M10 11c3-3.5 9-3.5 12 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

    <nav class="hidden lg:flex items-center gap-8" aria-label="Navegación principal">

      <a href="tel:+525512345678" class="phone-link hidden sm:flex" aria-label="Llamar a la clínica">

          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.08 3.38 2 2 0 0 1 3.05 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21 16l.92.92z"/>

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

<!-- ══════════════════════════════════════
     HERO — full screen editorial
══════════════════════════════════════ -->
<main>
<section id="hero" aria-labelledby="hero-heading">

  <!-- Rounded image card -->
  <div id="hero-card">

    <!-- Background image -->
    <div id="hero-bg" aria-hidden="true">
      <img src="assets/hero2.jpeg"
           alt=""
           loading="eager"
           onerror="this.src='assets/hero2.jpg'; this.onerror=function(){this.parentElement.style.background='linear-gradient(155deg,#0F2027 0%,#203A43 50%,#2C5364 100%)';};" />
    </div>

    <!-- Overlay -->
    <div id="hero-overlay" aria-hidden="true"></div>

    <!-- Main content — bottom left -->
    <div id="hero-content">

    <!-- Headline — the star of the show -->
    <h1 id="hero-heading" class="hero-headline reveal d2">
      Tu sonrisa<br/>
      merece<br/>
      <em>lo mejor.</em>
    </h1>

    <!-- One clean sub-line -->
    <p class="hero-sub reveal d3">
      Tecnología de vanguardia y atención personalizada<br class="hidden sm:block"/>
      en el corazón de Polanco.
    </p>

    <!-- Single CTA -->
    <div class="reveal d4">
      <a href="#contacto" class="btn-hero" aria-label="Agenda tu cita en Clínica Dental Lumina">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>

      </a>

  </div>

    <!-- Scroll indicator — inside card -->
    <div class="scroll-hint" aria-hidden="true">
      <span style="font-size:0.6rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.12em;writing-mode:vertical-rl;">Scroll</span>
      <div style="width:1px;height:48px;background:linear-gradient(to bottom,rgba(255,255,255,0.4),transparent);margin-top:0.5rem;"></div>
    </div>


  </div><!-- /hero-card -->

</section>
</main>

<!-- placeholder next sections -->
<div style="height:80px;background:var(--bg);"></div>


<!-- ══════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════ -->
<script>
  /* Mobile menu */
  const overlay = document.getElementById('mob-overlay');
  document.getElementById('open-mob').addEventListener('click', () => {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('close-mob').focus();
  });
  document.getElementById('close-mob').addEventListener('click', closeMob);
  function closeMob() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('open-mob').focus();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMob();
  });

  /* Header — 3 states: transparent / liquid-dark / liquid-light */
  const hdr = document.getElementById('site-header');
  const heroSection = document.getElementById('hero');
  function updateHeader() {
    const scrolled = window.scrollY > 60;
    const pastHero = heroSection.getBoundingClientRect().bottom < 80;
    hdr.classList.toggle('scrolled', scrolled);
    hdr.classList.toggle('over-light', pastHero);
  }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();

  /* Parallax on hero image */
  const heroBg = document.getElementById('hero-bg');
  window.addEventListener('scroll', () => {
    heroBg.style.transform = `translateY(${window.scrollY * 0.3}px)`;
  }, { passive: true });

  /* Intersection Observer — reveal */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
