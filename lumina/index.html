<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dental Lumina — Polanco, CDMX</title>
  <meta name="description" content="Clínica dental de alta especialidad en Polanco, CDMX. Ortodoncia, implantes, estética dental y más." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans:  ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --mint:        #0D9488;
      --mint-light:  #14B8A6;
      --mint-pale:   #CCFBF1;
      --white:       #FFFFFF;
      --navy:        #0F172A;
      --slate:       #475569;
      --slate-light: #94A3B8;
      --border:      #E2E8F0;
      --gold:        #C9A84C;
      --bg:          #F8FAFB;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html  { scroll-behavior: smooth; }
    body  { font-family: 'Inter', sans-serif; background: var(--white); color: var(--navy); overflow-x: hidden; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }

    /* ── Reveal ──────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .d1 { transition-delay: 0.1s;  }
    .d2 { transition-delay: 0.25s; }
    .d3 { transition-delay: 0.4s;  }
    .d4 { transition-delay: 0.55s; }

    /* ── Header ──────────────────────────── */
    #site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      padding: 2rem 0;
      transition:
        background 0.55s cubic-bezier(0.16,1,0.3,1),
        padding    0.55s cubic-bezier(0.16,1,0.3,1),
        box-shadow 0.55s cubic-bezier(0.16,1,0.3,1),
        border-color 0.55s;
      border-bottom: 1px solid transparent;
    }

    /* State 2 — liquid glass dark (scrolled, still over hero) */
    #site-header.scrolled {
      padding: 1.1rem 0;
      background: rgba(8, 16, 26, 0.14);
      backdrop-filter: blur(56px) saturate(180%) brightness(1.1);
      -webkit-backdrop-filter: blur(56px) saturate(180%) brightness(1.1);
      border-bottom: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.13),
        0 8px 48px rgba(0,0,0,0.08);
    }

    /* State 3 — liquid glass light (past hero, over white sections) */
    #site-header.scrolled.over-light {
      background: rgba(248,250,251,0.68);
      backdrop-filter: blur(56px) saturate(200%) brightness(1.04);
      -webkit-backdrop-filter: blur(56px) saturate(200%) brightness(1.04);
      border-bottom: 1px solid rgba(255,255,255,0.92);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.95),
        0 6px 40px rgba(15,23,42,0.07);
    }

    /* Logo */
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 600;
      color: white; text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.5s;
    }
    .logo-dot { color: var(--gold); }
    #site-header.scrolled.over-light .logo { color: var(--navy); }

    /* Nav links */
    .nav-link {
      font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.85); text-decoration: none;
      padding: 0.25rem 0; position: relative;
      transition: color 0.3s;
    }
    .nav-link::after {
      content:''; position:absolute; bottom:-2px; left:0;
      width:0; height:1.5px; background:var(--mint);
      transition: width 0.25s ease;
    }
    .nav-link:hover { color: white; }
    .nav-link:hover::after { width: 100%; }
    #site-header.scrolled.over-light .nav-link { color: var(--slate); }
    #site-header.scrolled.over-light .nav-link:hover { color: var(--navy); }

    /* Phone link */
    .phone-link {
      font-size: 0.85rem; font-weight: 500;
      color: rgba(255,255,255,0.75);
      text-decoration: none; display: flex; align-items: center; gap: 0.4rem;
      transition: color 0.3s;
    }
    .phone-link:hover { color: white; }
    #site-header.scrolled.over-light .phone-link { color: var(--slate-light); }
    #site-header.scrolled.over-light .phone-link:hover { color: var(--navy); }

    /* CTA nav button */
    .btn-nav {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--mint); color: white;
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em;
      padding: 0.6rem 1.4rem; border-radius: 50px;
      text-decoration: none; min-height: 44px;
      transition: background 0.2s, transform 0.15s;
      touch-action: manipulation;
    }
    .btn-nav:hover { background: var(--mint-light); transform: translateY(-1px); }
    .btn-nav:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

    /* Hamburger icon */
    .menu-icon { color: white; transition: color 0.5s; }
    #site-header.scrolled.over-light .menu-icon { color: var(--navy); }

    /* ── Mobile menu ─────────────────────── */
    #mob-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(15,23,42,0.97); backdrop-filter: blur(20px);
      flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem;
    }
    #mob-overlay.open { display: flex; }
    .mob-link {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; color: white; text-decoration: none;
      transition: color 0.2s;
    }
    .mob-link:hover { color: var(--mint-light); }

    /* ── HERO ────────────────────────────── */
    /* White page background — image lives inside a rounded card */
    body { background: var(--white); }

    #hero {
      padding: 1rem;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--white);
    }
    @media (min-width: 640px)  { #hero { padding: 1rem; } }
    @media (min-width: 1024px) { #hero { padding: 1rem; } }

    /* The rounded card that holds the image */
    #hero-card {
      position: relative;
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      min-height: calc(100dvh - 2rem);
      display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: 0 24px 80px rgba(15,23,42,0.18);
    }
    @media (min-width: 640px)  { #hero-card { border-radius: 24px; min-height: calc(100dvh - 2rem); } }
    @media (min-width: 1024px) { #hero-card { border-radius: 32px; min-height: calc(100dvh - 2rem); } }

    /* ── Carousel ───────────────────────── */
    #hero-bg {
      position: absolute; inset: 0;
      background: var(--navy); overflow: hidden;
    }

    .hero-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center 25%;
      opacity: 0;
      will-change: transform, opacity;
    }
    .hero-slide.is-active { opacity: 1; }

    /* Shard grid — sits on top during transitions */
    #shard-grid {
      position: absolute; inset: 0; z-index: 5;
      pointer-events: none; overflow: hidden;
    }
    .shard {
      position: absolute;
      will-change: transform, opacity;
    }

    /* Navigation dots */
    #hero-dots {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 0.55rem; align-items: center;
    }
    .hero-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer; transition: background 0.3s, transform 0.3s;
      border: none; padding: 0;
    }
    .hero-dot.active {
      background: white; transform: scale(1.35);
    }

    /* Gradient overlay */
    #hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(15,23,42,0.75) 0%, rgba(15,23,42,0.4) 55%, rgba(15,23,42,0.1) 100%),
        linear-gradient(to top,   rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.0) 55%);
    }

    /* Hero content — inside the card, bottom-left */
    #hero-content {
      position: relative; z-index: 10;
      padding: 2.5rem 2.5rem 2rem;
      max-width: 820px;
    }
    @media (min-width: 640px)  { #hero-content { padding: 3rem 3.5rem 2.5rem; } }
    @media (min-width: 1024px) { #hero-content { padding: 4rem 5rem 3.5rem; } }

    /* Big headline */
    .hero-headline {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(3rem, 7vw, 7rem);
      line-height: 1.0;
      color: white;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
    }
    .hero-headline em {
      font-style: italic;
      color: var(--mint-light);
    }

    /* Sub-line — just one sentence */
    .hero-sub {
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      font-weight: 300;
      color: rgba(255,255,255,0.72);
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 2.5rem;
      letter-spacing: 0.01em;
    }

    /* CTA hero button */
    .btn-hero {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: var(--mint);
      color: white;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 1rem 2.25rem; border-radius: 50px;
      text-decoration: none; min-height: 52px;
      box-shadow: 0 4px 24px rgba(13,148,136,0.45);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation; position: relative; overflow: hidden;
    }
    .btn-hero::before {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
      border-radius: inherit;
    }
    .btn-hero:hover  { background: var(--mint-light); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(13,148,136,0.55); }
    .btn-hero:active { transform: translateY(0); }
    .btn-hero:focus-visible { outline: 3px solid white; outline-offset: 3px; }


    /* Scroll indicator */
    @keyframes scrollBounce {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50%      { transform: translateY(8px); opacity: 1; }
    }
    .scroll-hint {
      position: absolute; right: 2.5rem; bottom: 7rem; z-index: 11;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      animation: scrollBounce 2.5s ease-in-out infinite;
    }
    @media (max-width: 768px) { .scroll-hint { display: none; } }

    /* ── Buttons for other sections ──────── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: linear-gradient(135deg, var(--mint-light) 0%, var(--mint) 100%);
      color: white; font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.9rem 2rem; border-radius: 50px; border: none;
      cursor: pointer; text-decoration: none; min-height: 48px;
      box-shadow: 0 4px 18px rgba(13,148,136,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }
    .btn-primary:hover  { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(13,148,136,0.45); }
    .btn-primary:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

    .btn-outline {
      display: inline-flex; align-items: center; gap: 0.5rem;
      border: 1.5px solid var(--border); color: var(--navy);
      background: var(--white); font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.9rem 2rem; border-radius: 50px;
      cursor: pointer; text-decoration: none; min-height: 48px;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      touch-action: manipulation;
    }
    .btn-outline:hover { border-color: var(--mint); color: var(--mint); background: #F0FDFA; }
  </style>
</head>

<!-- ══════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════ -->
<script>
  /* Mobile menu */
  const overlay = document.getElementById('mob-overlay');
  document.getElementById('open-mob').addEventListener('click', () => {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('close-mob').focus();
  });
  document.getElementById('close-mob').addEventListener('click', closeMob);
  function closeMob() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('open-mob').focus();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMob();
  });

  /* Header — 3 states: transparent / liquid-dark / liquid-light */
  const hdr = document.getElementById('site-header');
  const heroSection = document.getElementById('hero');
  function updateHeader() {
    const scrolled = window.scrollY > 60;
    const pastHero = heroSection.getBoundingClientRect().bottom < 80;
    hdr.classList.toggle('scrolled', scrolled);
    hdr.classList.toggle('over-light', pastHero);
  }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();

  /* ── Shard carousel ──────────────────── */
  (function () {
    const COLS = 22, ROWS = 14;
    const slides = Array.from(document.querySelectorAll('.hero-slide'));
    const grid   = document.getElementById('shard-grid');
    const card   = document.getElementById('hero-card');
    const dotsEl = document.getElementById('hero-dots');
    let cur = 0, busy = false, timer;
    const AUTO = 5500;

    /* Preload images → store natural dimensions for exact cover math */
    const naturalSizes = {};
    slides.forEach(slide => {
      const bg = window.getComputedStyle(slide).backgroundImage;
      const m  = bg.match(/url\(["']?([^"')]+)["']?\)/);
      if (m) {
        const img = new Image();
        img.onload = () => { naturalSizes[m[1]] = { w: img.naturalWidth, h: img.naturalHeight }; };
        img.src = m[1];
      }
    });

    slides[0].classList.add('is-active');

    /* Build dots */
    slides.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.className = 'hero-dot' + (i === 0 ? ' active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-label', `Diapositiva ${i + 1}`);
      btn.addEventListener('click', () => { if (!busy) go(i > cur ? 1 : -1, i); });
      dotsEl.appendChild(btn);
    });

    function setDots(idx) {
      dotsEl.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    /* Parse "center 25%" / "50% 30%" → fractions */
    function parseBgPos(str) {
      const kw = { center:0.5, left:0, right:1, top:0, bottom:1 };
      const parts = str.trim().split(/\s+/);
      const toF = s => s in kw ? kw[s] : (parseFloat(s) / 100);
      return { x: toF(parts[0] || 'center'), y: toF(parts[1] || 'center') };
    }

    /* Create shards that EXACTLY mirror the slide's cover appearance */
    function createShards(curSlide) {
      const bgImage = window.getComputedStyle(curSlide).backgroundImage;
      const bgPos   = window.getComputedStyle(curSlide).backgroundPosition;
      const cw = card.offsetWidth;
      const ch = card.offsetHeight;

      /* Default: fill container 1:1 */
      let coverW = cw, coverH = ch, ox = 0, oy = 0;

      const m = bgImage.match(/url\(["']?([^"')]+)["']?\)/);
      if (m && naturalSizes[m[1]]) {
        const nat   = naturalSizes[m[1]];
        const scale = Math.max(cw / nat.w, ch / nat.h); /* same as background-size:cover */
        coverW = nat.w * scale;
        coverH = nat.h * scale;
        const pos = parseBgPos(bgPos);
        ox = (cw - coverW) * pos.x;
        oy = (ch - coverH) * pos.y;
      }

      const sw = cw / COLS;
      const sh = ch / ROWS;
      const frag = document.createDocumentFragment();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = document.createElement('div');
          el.className = 'shard';
          const sx = c * sw, sy = r * sh;
          /* background-position offsets so each shard shows its exact tile */
          el.style.cssText =
            `left:${sx}px;top:${sy}px;` +
            `width:${sw + 1}px;height:${sh + 1}px;` +
            `background-image:${bgImage};` +
            `background-size:${coverW}px ${coverH}px;` +
            `background-position:${ox - sx}px ${oy - sy}px;`;
          frag.appendChild(el);
        }
      }
      grid.innerHTML = '';
      grid.appendChild(frag);
      return Array.from(grid.children);
    }

    function go(dir, targetIdx) {
      if (busy || slides.length < 2) return;
      busy = true;
      clearTimeout(timer);

      const next = targetIdx !== undefined
        ? targetIdx
        : (cur + dir + slides.length) % slides.length;

      const shards = createShards(slides[cur]);

      slides[cur].classList.remove('is-active');
      slides[next].classList.add('is-active');
      setDots(next);

      const maxDelay = 480;
      shards.forEach(shard => {
        const delay = Math.random() * maxDelay;
        const dx    = dir * (120 + Math.random() * 220);
        const dy    = (Math.random() - 0.5) * 110;
        const dur   = 440 + Math.random() * 320;
        const rot   = (Math.random() - 0.5) * 18;
        const sc    = 0.55 + Math.random() * 0.25;
        setTimeout(() => {
          shard.style.transition =
            `transform ${dur}ms cubic-bezier(0.4,0,0.9,1),` +
            `opacity ${dur * 0.65}ms ease`;
          shard.style.transform =
            `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${sc})`;
          shard.style.opacity = '0';
        }, delay);
      });

      setTimeout(() => {
        grid.innerHTML = '';
        cur = next;
        busy = false;
        scheduleNext();
      }, maxDelay + 820);
    }

    function scheduleNext() {
      if (slides.length > 1) timer = setTimeout(() => go(1), AUTO);
    }

    scheduleNext();
  })();

  /* Intersection Observer — reveal */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>

</body>
</html>
